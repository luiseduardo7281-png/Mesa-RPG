<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesa de RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Cinzel:wght@600;800&family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{color-scheme:dark;--bg:#0f1513;--panel:#18211e;--ink:#e9e6dc;--mut:#a9a89c;--line:#59594f;--map:#26322d;--grid:#43524a;--acc:#c9a24a;--btn:#8a3b2a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 'Barlow',Georgia,serif}
header{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
h1{font:800 18px Cinzel,Georgia,serif;margin:0}#st,#who{color:var(--mut);font-size:13px}
main{display:grid;grid-template-columns:1fr 340px;gap:12px;padding:12px;align-items:start}
@media (max-width:820px){main{grid-template-columns:1fr}}
#wrap{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
canvas{display:block;width:100%;touch-action:none;background:var(--map)}
aside{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:calc(100vh - 80px);overflow:auto}
@media (max-width:820px){aside{max-height:none}}
h2{font:800 13px Cinzel,Georgia,serif;margin:14px 0 8px;color:var(--ink);text-transform:uppercase;letter-spacing:.12em;display:inline-block;padding:2px 16px 2px 10px;background:linear-gradient(90deg,rgba(255,255,255,.2),rgba(255,255,255,.03));border-top:1px solid #8d8b80;border-bottom:1px solid #8d8b80}
button{font:inherit;background:var(--btn);color:#fff;border:0;border-radius:6px;padding:5px 9px;cursor:pointer}
button.g{background:transparent;color:inherit;border:1px solid var(--line)}button:disabled{opacity:.45;cursor:default}
input,select,textarea{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:rgba(255,255,255,.06);color:var(--ink);min-width:0}
option{background:#18211e;color:#e9e6dc}
.row{display:flex;gap:6px;margin:6px 0;align-items:center;flex-wrap:wrap}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0}.sw.on{border-color:var(--ink)}
#log div,#ovlog div{font-size:13px;padding:3px 0;border-bottom:1px dotted var(--line)}
#log a,#ovlog a{display:inline-block;margin:0 1px;padding:0 5px;border-radius:4px;background:var(--btn);color:#fff;cursor:pointer;text-decoration:none}
.ok{color:#2e9d3a;font-weight:700}.bad{color:#e04848;font-weight:700}.mut{color:var(--mut);font-size:13px}
.bar{height:8px;background:rgba(0,0,0,.25);border-radius:4px;overflow:hidden;margin:2px 0 6px}.bar i{display:block;height:100%;background:#4caf50}
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:20}
#login form{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;width:min(340px,92vw)}
#login input{width:100%;margin:6px 0}#err{color:#e04848;font-size:13px;min-height:18px}
/* ---------- ficha (estilo das fichas do playtest) ---------- */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:10;overflow:auto;padding:10px}
#sh{--ink:#e9e6dc;--mut:#a9a89c;--line:#59594f;--acc:#c9a24a;--bg:#18211e;max-width:1060px;margin:0 auto;position:relative;color:var(--ink);padding:20px 26px 26px;border-radius:6px;
 background:radial-gradient(900px 500px at 15% 0,#2b3b35 0,#141b19 75%),#121917;border:2px solid #8a897d;box-shadow:inset 0 0 0 5px #121917,inset 0 0 0 6px #6d6c62,0 10px 40px #000}
#sh input,#sh select,#sh textarea{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line);border-radius:4px}
#sh button.g{border-color:var(--line);color:var(--ink)}
#sh button:not(.g):not(.die):not(.pip){background:#8a3b2a;color:#fff}
#x{position:absolute;right:12px;top:10px}
.tabs{display:flex;gap:6px;margin:8px 0}.tabs button{background:transparent!important;border:1px solid var(--line);color:var(--ink)!important}.tabs button.on{background:rgba(201,162,74,.25)!important;border-color:var(--acc)}
.hd{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #8a897d;padding-bottom:10px}
.ttl{font:800 clamp(30px,6vw,52px)/1 Cinzel,Georgia,serif;font-variant:small-caps;letter-spacing:.03em}.sub{font:800 20px Cinzel,serif;font-variant:small-caps}
#sh input.tin{font:800 clamp(28px,5vw,46px) Cinzel,Georgia,serif;background:transparent;border:0;border-bottom:1px dashed var(--line);width:min(100%,330px)}
#sh input.sin{font:800 18px Cinzel,serif;background:transparent;border:0;border-bottom:1px dashed var(--line);width:min(100%,300px)}
.chip{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.12);padding:3px 10px;border-top:1px solid #8d8b80;border-bottom:1px solid #8d8b80;font:700 13px Cinzel,serif;letter-spacing:.1em;text-transform:uppercase}
.chip select,.chip input{font:700 13px Cinzel,serif;text-transform:uppercase;width:auto;max-width:150px}
.lvb{width:58px;height:58px;border-radius:50%;border:4px double #9a988c;display:grid;place-items:center}
#sh .lvb input{width:40px;border:0;background:transparent;text-align:center;font:800 28px Cinzel,serif;padding:0}
.cols{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:6px 26px}@media (max-width:820px){.cols{grid-template-columns:1fr}}
.bn{display:inline-block;padding:2px 16px 2px 10px;font:800 13px Cinzel,serif;letter-spacing:.12em;text-transform:uppercase;background:linear-gradient(90deg,rgba(255,255,255,.2),rgba(255,255,255,.03));border-top:1px solid #8d8b80;border-bottom:1px solid #8d8b80;margin:14px 0 8px}
.ar{display:flex;align-items:center;gap:10px;font:800 26px Cinzel,serif;font-variant:small-caps;margin:2px 0}.ar .up{font:600 12px Barlow;color:var(--acc)}
.die{--s:26px;width:var(--s);height:var(--s);display:inline-grid;place-items:center;background:#cdc8ba;color:#1a211f;font:800 12px Barlow,sans-serif;padding:0;border:0;border-radius:0;flex:none}
button.die{cursor:pointer}.die.d4{clip-path:polygon(50% 4%,100% 96%,0 96%);padding-top:7px}.die.d6{border-radius:4px}
.die.d8{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}.die.d10{clip-path:polygon(50% 0,100% 36%,84% 100%,16% 100%,0 36%)}
.die.d12,.die.d20{clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)}.die.d20{background:#d9b25a}
.sk{display:grid;grid-template-columns:1fr auto auto auto 62px 58px;gap:6px;align-items:center;font-size:13px;padding:3px 0;border-bottom:1px dotted var(--line)}
.skn{font:700 12px Barlow;text-transform:uppercase;letter-spacing:.06em;text-align:right}.sk small{color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.sk button{padding:2px 6px;font-size:12px}
.bxs{display:flex;flex-wrap:wrap;gap:3px;max-width:330px}.bx{width:15px;height:11px;border:1.5px solid #c9c6b8;background:transparent;cursor:pointer;transform:skewX(-12deg)}.bx.on{background:#f1eee3}
.vit{display:flex;gap:10px;align-items:center;margin:6px 0}.vit b{font:800 26px Cinzel,serif;min-width:70px}.vit .lb{font:800 17px Cinzel,serif}
.pip{width:34px;height:15px;border:2px solid #9a988c;border-radius:8px;background:transparent;padding:0}.pip.on{background:#e9e6dc;border-color:#e9e6dc}
.card{background:rgba(255,255,255,.05);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:4px;padding:8px 10px;margin:8px 0}
.ch{display:flex;gap:6px;align-items:center}#sh input.ct{font:800 14px Cinzel,serif;text-transform:uppercase;letter-spacing:.08em;background:transparent;border:0;border-bottom:1px solid var(--line);flex:1;min-width:0}
.card textarea{width:100%;margin-top:6px;resize:vertical;background:transparent;border:0;border-top:1px dotted var(--line);padding:4px 0;font-size:14px;line-height:1.4}
.x{background:transparent!important;color:var(--mut)!important;padding:0 6px}
.eq .ch select,.eq .ch input.dm{width:auto}.eq .ch input.dm{width:70px}
.rl{display:grid;grid-template-columns:90px auto 130px 1fr;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dotted var(--line)}@media(max-width:700px){.rl{grid-template-columns:80px auto 1fr}.rl input:last-child{grid-column:1/-1}}
.rl b{font:800 14px Cinzel,serif;letter-spacing:.1em}.rp i{display:inline-block;width:15px;height:15px;border:2px solid #9a988c;border-radius:50%;margin-right:3px;cursor:pointer}.rp i.on{background:var(--acc);border-color:var(--acc)}
#rb{position:sticky;bottom:0;margin:14px -26px -26px;padding:8px 26px;background:#10161400;background:rgba(14,20,18,.96);border-top:1px solid #8a897d}
#ovlog{max-height:120px;overflow:auto;margin-top:4px}#ovlog a{background:#8a3b2a}
.sm button{padding:2px 8px;font-size:12px}
.av{width:var(--z,26px);height:var(--z,26px);border-radius:50%;display:inline-grid;place-items:center;color:#fff;font:700 12px Georgia;overflow:hidden;flex:none;border:2px solid rgba(255,255,255,.45)}.av img{width:100%;height:100%;object-fit:cover}
.por{width:104px;height:104px;border-radius:10px;border:2px solid #8a897d;display:grid;place-items:center;font:800 40px Cinzel,serif;overflow:hidden;position:relative;background:#222d29;flex:none}.por img{width:100%;height:100%;object-fit:cover}.por button{position:absolute;bottom:2px;left:2px;right:2px;font-size:11px;padding:1px 0;opacity:.9}
.cr{display:flex;gap:6px;align-items:center;padding:3px 4px;border-radius:4px;flex-wrap:wrap;cursor:pointer}.cr.on{background:rgba(138,59,42,.2)}.cr.dn{opacity:.5}.cr select{font-size:12px;padding:1px}.cr button{font-size:11px;padding:1px 6px}
.cc{font:700 10px Barlow,sans-serif;color:#fff;border-radius:8px;padding:0 7px;text-transform:uppercase;letter-spacing:.05em}
.cg{margin:6px 0;border-left:3px solid var(--line);padding-left:6px}.cg.cur{border-left-color:var(--acc);background:rgba(138,59,42,.07)}.cg h3{margin:0;font:800 12px Cinzel,Georgia,serif;letter-spacing:.06em}
.lib{border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:8px 0}.lib b{font:800 12px Cinzel,Georgia,serif;letter-spacing:.06em}
.li{display:flex;gap:6px;align-items:center;padding:2px 0}.li img{width:30px;height:30px;object-fit:contain}.li span{flex:1;font-size:13px}.li button{font-size:11px;padding:1px 7px}
.tl button{font-size:11px;padding:2px 7px}.tl button.on{background:var(--acc);color:#1a1a14}

#wrap{position:relative;aspect-ratio:880/560}canvas{height:100%}
#zm{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;gap:4px;z-index:2}#zm button{width:36px;height:36px;padding:0;background:rgba(20,24,22,.78);color:#fff;font-size:18px;border-radius:8px}
#mini{position:absolute;left:6px;right:52px;bottom:6px;background:rgba(18,23,21,.94);color:#eee;border:1px solid #4a4a42;border-radius:10px;padding:6px 8px;display:flex;gap:8px;align-items:center;z-index:2}
#mini .bar{margin:3px 0}#mini small{color:#bbb}#mini button{padding:6px 10px;min-height:36px}#mini button.g{border-color:#666;color:#eee}
body:not(.m) #mini{display:none!important}
#tabs{display:none}
.doc{flex-wrap:wrap;border-bottom:1px dotted var(--line);padding:5px 0}.doc .ic{flex:none;font-size:20px;flex:0 0 auto}.doc>span:nth-child(2){min-width:130px}
#dv{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
#dh{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);padding-top:max(8px,env(safe-area-inset-top))}
#dh b{font:800 15px Cinzel,Georgia,serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dh a{background:var(--btn);color:#fff;border-radius:6px;padding:6px 10px;text-decoration:none;font-size:13px}
#db{flex:1;overflow:auto;padding:10px;-webkit-overflow-scrolling:touch}#db iframe{width:100%;height:100%;min-height:75vh;border:0;background:#fff}#db img{max-width:100%;display:block;margin:0 auto}
.dtxt{white-space:pre-wrap;line-height:1.6;font-size:16px;max-width:760px;margin:0 auto;font-family:Georgia,serif}
body.m header{padding:6px 10px}body.m #who{display:none}body.m h1{font-size:15px}
body.m main{display:block;padding:0}
body.m #wrap{aspect-ratio:auto;height:calc(100vh - 44px - 54px);height:calc(100dvh - 44px - 54px - env(safe-area-inset-bottom));border:0;border-radius:0}
body.m aside{max-height:none;border:0;border-radius:0;padding:12px 12px 76px;min-height:calc(100vh - 100px)}
body.m [data-sec]{display:none}
body.m[data-tab="tok"] [data-sec="tok"],body.m[data-tab="cmb"] [data-sec="cmb"],body.m[data-tab="log"] [data-sec="log"],body.m[data-tab="doc"] [data-sec="doc"],body.m[data-tab="gm"] [data-sec="gm"]{display:block}
body.m[data-tab="map"] aside{display:none}body.m:not([data-tab="map"]) #wrap{display:none}
body.m #tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
body.m #tabs button{flex:1;background:transparent;color:var(--mut);border-radius:0;font-size:11px;padding:6px 2px;min-height:54px;line-height:1.15}
body.m #tabs button span{display:block;font-size:18px}body.m #tabs button.on{color:var(--acc);box-shadow:inset 0 3px var(--acc)}
body.m button,body.m select,body.m input{min-height:36px}body.m input[type=checkbox]{min-height:0}
@media (max-width:820px){
 #ov{padding:0}#sh{padding:14px 12px 20px;border-radius:0;min-height:100%;border-width:0}
 #x{position:static;float:right;margin-bottom:6px}.por{width:84px;height:84px}
 .sk{grid-template-columns:1fr auto auto auto 56px}.sk small{display:none}.skn{text-align:left}
 #rb{margin:12px -12px -20px;padding:8px 12px}.ar{font-size:22px}
 .cr select,.cr button{min-height:32px}.bx{width:17px;height:13px}
}

body{background:radial-gradient(1100px 600px at 12% -5%,#26352f 0,#0f1513 70%) fixed,#0f1513;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;z-index:0;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
header{background:linear-gradient(180deg,#1b2622,#0f1513);border-bottom:2px solid #8a897d;box-shadow:inset 0 -1px 0 #121917,0 2px 10px rgba(0,0,0,.5)}
h1{font:800 20px Cinzel,Georgia,serif;font-variant:small-caps;letter-spacing:.08em;color:#efe9d8}#st{color:var(--acc)}
#wrap,aside{border:2px solid #8a897d;border-radius:6px;box-shadow:inset 0 0 0 4px #121917,inset 0 0 0 5px #6d6c62,0 6px 22px rgba(0,0,0,.45)}
aside{background:radial-gradient(700px 400px at 20% 0,#22302a 0,#141b19 80%),#121917}
#wrap{background:#0f1513}canvas{border-radius:3px}
.lib{background:rgba(255,255,255,.05);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:4px}
#login form{background:radial-gradient(500px 300px at 20% 0,#26352f 0,#141b19 80%);border:2px solid #8a897d;box-shadow:inset 0 0 0 4px #121917,inset 0 0 0 5px #6d6c62,0 10px 40px #000}
#login h1{font-size:28px;text-align:center;margin-bottom:6px}
#dv{background:radial-gradient(900px 500px at 15% 0,#26352f 0,#141b19 75%),#121917}
#dh{background:rgba(0,0,0,.25);border-bottom:2px solid #8a897d}
.cg.cur{background:rgba(201,162,74,.08);border-left-color:var(--acc)}.cr.on{background:rgba(201,162,74,.16)}
#mini{border:1px solid #8a897d;box-shadow:0 4px 14px rgba(0,0,0,.6)}
body.m #tabs{background:linear-gradient(180deg,#1b2622,#0f1513);border-top:2px solid #8a897d}body.m #tabs button.on{color:var(--acc);box-shadow:inset 0 3px var(--acc)}
.rst{background:rgba(255,255,255,.05);border:1px dashed var(--line);border-radius:6px;padding:10px;margin-top:8px}
/* ----- ficha no celular: uma seção por vez ----- */
#sh.mob{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:0;border:0;border-radius:0;max-width:none;box-shadow:none;min-height:0}
.mob .shtop{padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:2px solid #8a897d;background:rgba(0,0,0,.28)}
.mob .hd2{display:flex;gap:10px;align-items:center;margin:8px 0}.mob .hd2 .por{width:68px;height:68px;font-size:28px}
#sh.mob input.tin{font-size:26px;width:100%}#sh.mob input.sin{font-size:15px;width:100%;margin-top:2px}
.seg{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;white-space:nowrap;background:transparent!important;border:1px solid var(--line);color:var(--ink)!important;padding:8px 12px;font-size:13px;min-height:40px}
.seg button.on{background:rgba(201,162,74,.22)!important;border-color:var(--acc)}
.shbody{flex:1;overflow:auto;padding:6px 12px 16px;-webkit-overflow-scrolling:touch}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center}
.tile small{display:block;font:800 12px Cinzel,serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.tile .die{--s:46px;font-size:18px}.tile em{display:block;color:var(--acc);font-size:11px;font-style:normal;margin-top:2px}
.stp{display:flex;align-items:center;gap:6px;margin:8px 0}.stp b{font:800 15px Cinzel,serif;width:78px}
.stp span{flex:1;text-align:center;font:600 16px Barlow,sans-serif}.stp big{font:800 32px Cinzel,serif}.stp button{min-width:46px;min-height:46px;font-size:16px;padding:0 8px}
.skm{display:grid;grid-template-columns:1fr auto 76px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dotted var(--line)}
.skm .sn b{font:700 14px Barlow,sans-serif;text-transform:uppercase;letter-spacing:.05em;display:block}.skm .sn small{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.skm .sd{display:flex;align-items:center;gap:6px}.skm .die{--s:32px;font-size:13px}.skm button.rb{min-height:44px}
.mob .card{margin:10px 0}.mob .ch{flex-wrap:wrap}.mob .eq .ch input.ct{flex:1 1 100%}.mob .eq .ch select{flex:1}.mob .eq .ch button{min-height:40px}
.mob textarea{font-size:15px}.mob .rl{grid-template-columns:84px auto 1fr}.mob .rl input:last-child{grid-column:1/-1}
#sh.mob #rb{margin:0;padding:6px 10px calc(6px + env(safe-area-inset-bottom));border-top:2px solid #8a897d;position:static;background:rgba(10,15,13,.98)}
#sh.mob #ovlog{max-height:58px}#sh.mob #rb .row{margin:2px 0}
.ctl{flex:1;font:800 17px Cinzel,Georgia,serif;margin:0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#sh.mob #rb{font-size:13px}#sh.mob #rb select,#sh.mob #rb input[type=number]{padding:2px 4px}#sh.mob #rb .row{gap:5px}#sh.mob #r_dt{width:48px}#sh.mob #r_bo{max-width:128px}
.li span.av{flex:none}
#sh.mob .eq .ch input.ct{flex:1 1 100%;width:100%;min-width:100%;font-size:15px}

/* ----- escolha de sistema ----- */
#syssel{text-align:center;max-width:800px;padding:18px}#syssel h1.hero{font-size:34px;margin-bottom:4px}
.sysrow{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;margin-top:20px}
.sysc{width:320px;min-height:200px;border-radius:14px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;justify-content:center;font-family:inherit;cursor:pointer;transition:transform .15s;box-shadow:none;border:0}
.sysc:hover{transform:translateY(-5px) scale(1.02)}.sysc b{font-size:26px;line-height:1.1}.sysc span{font-size:14px;opacity:.92;font-weight:500;line-height:1.35}
.sc-ordem{background:radial-gradient(400px 220px at 20% 0,#2b3b35,#121917);border:2px solid #8a897d;box-shadow:inset 0 0 0 4px #121917,inset 0 0 0 5px #6d6c62,0 8px 24px rgba(0,0,0,.5);color:#e9e6dc}
.sc-ordem b{font-family:Cinzel,Georgia,serif;font-variant:small-caps;letter-spacing:.06em}
.sc-uni{background:linear-gradient(160deg,#1b3bff,#6a1bd6 60%,#00c8ff);border:4px solid #ffd500;border-radius:20px;box-shadow:0 7px 0 #b39500,0 0 34px rgba(0,200,255,.55);color:#fff}

<script>
const COLS=22,ROWS=14,CELL=40,W=COLS*CELL,H=ROWS*CELL;
const COLORS=['#b5483a','#c79a2b','#4f8a5b','#3f7cac','#7a5aa6','#2f7f7a','#8a6a3f','#555555'];
const FACES=[4,6,8,10,12,20],ATN=['Físico','Mente','Emoção'],CLS={executor:'Executor',vigilante:'Vigilante',analista:'Analista'};
const ATTR={Acrobacia:0,Animais:2,Aptidão:1,Atletismo:0,Bruxaria:1,Crime:0,Disciplina:2,Enganação:2,Furtividade:0,Inspecionar:1,Intimidar:2,Intuição:2,Luta:0,Medicina:1,Ofício:1,Percepção:1,Persuasão:2,Pontaria:0,Sobrevivência:1,Vigor:0};
const CORE={
 executor:{n:'Ímpeto',t:'Você possui uma barra de ímpeto, com cinco espaços. Sempre que faz um teste e falha, você preenche um espaço na barra de ímpeto. Como uma ação livre, você pode gastar espaços da barra de ímpeto para receber benefícios.\n• 1 espaço: você recebe +d4 em um teste.\n• 3 espaços: você aumenta um atributo em um passo até o fim da cena.\n• 3 espaços: em cenas de conflito, você faz uma ação extra.\nNo fim da cena, sua barra de ímpeto esvazia.'},
 vigilante:{n:'Prontidão',t:'Uma vez por rodada, quando você ou outro ser em alcance curto faz um teste, você pode gastar 2 PD para rolar novamente, ou para fazer o outro ser rolar novamente, um dos dados do teste cujo resultado não tenha sido 1.\nAlém disso, em combates, você pode fazer sua ação na fase dela ou em fases posteriores, e após qualquer ação daquela fase já ter sido rolada.'},
 analista:{n:'Análise',t:'Você pode gastar uma ação para receber 2 marcadores de análise.\n• Quando faz um teste, pode gastar quantos marcadores quiser após rolar os dados. Para cada marcador gasto, pode mudar o resultado de um dado em +1 ou –1 (até o máximo do dado).\n• Você pode acumular no máximo 4 marcadores de análise e, no fim da cena, perde quaisquer marcadores não usados.'}};
const base=n=>n.replace(/\s*\(.*\)\s*/,'').trim(),attrOf=n=>ATTR[base(n)]??1;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const blankO=()=>({cl:'executor',or:'',lv:1,ag:0,ds:'',at:[6,6,6],up:[0,0,0],sk:Object.keys(ATTR).map(n=>({n,d:4})),pd:[10,10],im:0,an:0,ar:0,ab:[],eq:[],rl:[],bio:''});
const blankS=()=>sysKey==='universus'?{cl:'',esp:'',lv:1,cred:0,pa:0,san:[0,0],pe:[0,0],pm:[0,0],at:[0,0,0,0,0,0],sk:[],eq:[],ab:[],mods:[],mg:[],bio:'',frag:'',idade:'',altura:'',gen:'',tal:'',deu:'',amb:'',link:'',def:'',esq:'',rd:'',mov:'',cap:'',modcap:'',mgdt:'',mgnote:''}:blankO();
const sec=s=>sysKey==='universus'?`SAN ${s.san[0]}/${s.san[1]}`:`PD ${s.pd[0]}/${s.pd[1]}`;
const N=COLS*ROWS;
let fog={on:false,seen:'0'.repeat(N),walls:'0'.repeat(N)},cfg={open:true},lib=[],placing=null,tool='move',paint=null,doff={x:0,y:0};
let sysKey='ordem';
let docs=[],pendingDoc=null,view={s:1,x:0,y:0,user:false},cw=W,ch=H,dpr=1,ptrs=new Map(),pinch=null,pan=null,mob=false;
let combat={on:false,round:1,phase:0,mode:'perfil',pick:{},done:{}},imgTarget=null,IM={};
let ws=null,me=null,tokens=[],mapImg=null,sel=null,drag=null,joined=null,lastMove=0,logs=[],tab=0,ft=null;
let ro={dt:7,step:0,bonus:'',pav:false};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,Math.trunc(+v)||0));
const tx=m=>ws&&ws.readyState===1&&ws.send(JSON.stringify(m));
const cur=()=>tokens.find(k=>k.id===sel);
const can=t=>t&&me&&(me.gm||(t.o&&t.o===me.name)||(cfg.open&&t.pc!==false));
const busy=()=>{const a=document.activeElement;return a&&$('ov').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)};
const getP=(o,p)=>p.split('.').reduce((x,k)=>x&&x[k],o);
const setP=(o,p,v)=>{const a=p.split('.');let x=o;for(let i=0;i<a.length-1;i++)x=x[a[i]];x[a[a.length-1]]=v};
const hidden=t=>me&&!me.gm&&t.pc===false&&!can(t);
const fix=t=>{t.s=t.s||blankS();t.z=t.z||1;return t};
const BADGE={executor:['E','#b5483a'],analista:['A','#3f7cac'],vigilante:['V','#4f8a5b']};
const av=(t,z=26)=>`<span class="av" style="--z:${z}px;background:${t.c}">${t.img?`<img src="${t.img}">`:esc((t.n[0]||'?').toUpperCase())}</span>`;
function setImg(t){delete IM[t.id];if(t.img){const im=new Image();im.onload=()=>{IM[t.id]=im;draw()};im.src=t.img}}

function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>{$('st').textContent='Conectado';if(joined)tx({t:'join',...joined})};
  ws.onclose=()=>{$('st').textContent='Desconectado – reconectando…';setTimeout(connect,2000)};
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.t==='error'){joined=null;me=null;$('login').hidden=false;$('err').textContent=m.msg}
    else if(m.t==='init'){me=m.me;if(m.sys)applySys(m.sys);$('swsys').hidden=false;$('login').hidden=true;$('gmbar').hidden=!me.gm;tokens=m.tokens.map(fix);tokens.forEach(setImg);combat=m.combat||combat;docs=m.docs||[];if(!view.user)setTimeout(()=>{fitView(false);clampView();draw()},0);$('tabgm').hidden=!me.gm;renderDocs();fog=m.fog||fog;cfg.open=m.open!==false;lib=m.lib||[];setMap(m.map);logs=m.log;
      if(!sel&&tokens.length)sel=(tokens.find(t=>t.o===me.name)||tokens[0]).id;quick();renderLog();draw()}
    else if(m.t==='full'){tokens=m.tokens.map(fix);tokens.forEach(setImg);if(!tokens.some(t=>t.id===sel))sel=null;quick();rerender();draw()}
    else if(m.t==='state'){const dl=drag&&tokens.find(k=>k.id===drag),keep=dl&&{x:dl.x,y:dl.y},old=Object.fromEntries(tokens.map(t=>[t.id,t.s]));
      tokens=m.tokens.map(t=>fix({...t,s:old[t.id],img:(tokens.find(o=>o.id===t.id)||{}).img}));if(keep){const t=tokens.find(k=>k.id===drag);if(t){t.x=keep.x;t.y=keep.y}}
      if(!tokens.some(t=>t.id===sel)){sel=null;$('ov').hidden=true}quick();if(!busy())rerender();draw()}
    else if(m.t==='sheet'){const t=tokens.find(k=>k.id===m.id);if(t){t.s=m.s;quick();if(!busy())rerender();renderLog()}}
    else if(m.t==='img'){const t=tokens.find(k=>k.id===m.id);if(t){t.img=m.data;setImg(t);quick();if(!busy())rerender();draw()}}
    else if(m.t==='combat'){combat=m.c;renderCombat()}
    else if(m.t==='fog'){fog=m.f;draw();renderLib()}
    else if(m.t==='cfg'){cfg.open=m.open;quick();rerender()}
    else if(m.t==='docs'){docs=m.list;renderDocs()}
    else if(m.t==='doc'){if(pendingDoc===m.id)showDoc(m)}
    else if(m.t==='docshow'){if(!me.gm)openDoc(m.id)}
    else if(m.t==='notice')alert(m.msg);
    else if(m.t==='map')setMap(m.data);
    else if(m.t==='roll'){const i=logs.findIndex(x=>x.id===m.r.id);if(i>=0)logs[i]=m.r;else logs.unshift(m.r);logs.length=Math.min(logs.length,40);renderLog()}
    else if(m.t==='who')$('who').textContent='Na mesa: '+m.list.join(', ')};
}
$('lf').onsubmit=e=>{e.preventDefault();joined={sys:sysKey,name:$('ln').value,pw:$('lp').value};$('err').textContent='';tx({t:'join',...joined});try{localStorage.setItem('mesa-n',$('ln').value)}catch(e){}};
try{$('ln').value=localStorage.getItem('mesa-n')||''}catch(e){}

function setMap(d){if(!d){mapImg=null;draw();return}const im=new Image();im.onload=()=>{mapImg=im;draw()};im.src=d}
const setCh=(str,i,v)=>str.slice(0,i)+v+str.slice(i+1);
function litCells(x,y,r,walls){const out=[];
  for(let cy=Math.max(0,y-r);cy<=Math.min(ROWS-1,y+r);cy++)for(let cx=Math.max(0,x-r);cx<=Math.min(COLS-1,x+r);cx++){
    const dx=cx-x,dy=cy-y;if(dx*dx+dy*dy>r*r+.5)continue;
    let x0=x,y0=y,bl=false;const sx=dx>0?1:-1,sy=dy>0?1:-1,ax=Math.abs(dx),ay=Math.abs(dy);let err=ax-ay;
    while(!(x0===cx&&y0===cy)){const e2=2*err;if(e2>-ay){err-=ay;x0+=sx}if(e2<ax){err+=ax;y0+=sy}
      if(x0===cx&&y0===cy)break;if(walls[y0*COLS+x0]==='1'){bl=true;break}}

    (k==='ab'?s.ab:k==='eqa'||k==='eqi'?s.eq:k==='mod'?s.mods:k==='mg'?s.mg:s.sk).push(A[k]);patch(t,{s},1);rerender();quick();return}
  if(d.ua){const[i,dv]=d.ua.split(':').map(Number);s.at[i]=clamp(s.at[i]+dv,-99,999);patch(t,{s},1);rerender();return}
  if(d.upd){const[k,dv]=d.upd.split(':');s[k][0]=clamp(s[k][0]+ +dv,0,s[k][1]);patch(t,{s},1);quick();rerender();return}
  if(d.hpd){t.hp=clamp(t.hp+ +d.hpd,0,t.max);patch(t,{hp:t.hp},1);draw();quick();rerender();return}
  if(d.pdd){s.pd[0]=clamp(s.pd[0]+ +d.pdd,0,s.pd[1]);patch(t,{s},1);quick();rerender();return}
  if(d.box){const[k,i]=d.box.split(':'),n=+i+1;if(k==='pv'){t.hp=t.hp===n?n-1:n;patch(t,{hp:t.hp},1);draw();quick()}else{s.pd[0]=s.pd[0]===n?n-1:n;patch(t,{s},1);quick()}rerender();return}
  if(d.im!==undefined){const i=+d.im;s.im=s.im===i+1?i:i+1}
  else if(d.an!==undefined){const i=+d.an;s.an=s.an===i+1?i:i+1}
  else if(d.an2){s.an=Math.min(4,s.an+2)}
  else if(d.arm){s.ar=clamp(s.ar+ +d.arm,0,9)}
  else if(d.spend){if(s.im<3)return;const[k,i]=d.spend.split(':');s.im-=3;if(k==='up')s.up[+i]=Math.min(2,s.up[+i]+1)}
  else if(d.rp){const[i,j]=d.rp.split(':').map(Number),r=s.rl[i];r.p=r.p===j+1?j:j+1}
  else if(d.add){s[d.add].push(d.add==='ab'?{n:'Nova habilidade',t:''}:d.add==='eq'?{n:'Novo item',k:'i',dm:'',t:''}:{n:'NOME',p:0,l:'NEUTRO',t:''})}
  else if(d.del){const[k,i]=d.del.split('.');if(k==='ab'&&sysKey==='ordem'&&!me.gm)return;s[k].splice(+i,1)}
  else if(d.end){s.im=0;s.an=0;s.up=[0,0,0]}
  else return;
  patch(t,{s},1);rerender();quick()});
$('ov').addEventListener('input',e=>{
  const t=cur(),el=e.target;if(!t)return;

  if(!can(t))return;

  if(el.dataset.p){setP(t.s,el.dataset.p,el.dataset.num?clamp(el.value,-999999,9999999):el.value);if(el.dataset.p==='pd.1'&&t.s.pd)t.s.pd[0]=Math.min(t.s.pd[0],t.s.pd[1]);patch(t,{s:t.s});quick()}});
$('ov').addEventListener('change',e=>{
  const t=cur(),el=e.target;if(!t)return;

  if(el.id==='r_st'){ro.step=+el.value;return}if(el.id==='r_bo'){ro.bonus=el.value;return}
  if(!can(t))return;const s=t.s;
  if(el.dataset.cls){const old=Object.values(CORE).map(c=>c.n);s.ab=s.ab.filter(a=>!old.includes(a.n));s.ab.unshift(CORE[el.value]);s.cl=el.value;patch(t,{s},1);rerender();quick();return}
  if(el.dataset.p&&el.dataset.r){setP(s,el.dataset.p,el.value);patch(t,{s},1);rerender()}});

/* ----- histórico de rolagens ----- */
function line(r){
  if(r.u){const sg=r.mod<0?'−':'+',hi=r.hi+r.mod,sm=r.sum+r.mod;
    return `<div><b>${esc(r.n)}</b> · ${esc(r.p)}: ${r.dice.length}d20 [${r.dice.map(d=>d.v===20?'<b class="ok">20</b>':d.v===1?'<b class="bad">1</b>':d.v).join(' · ')}] ${sg} ${Math.abs(r.mod)} → <b class="ok">${hi}</b>${r.dice.length>1?` <span class="mut">(maior dado) · soma ${sm}</span>`:''}</div>`}
  const t=cur(),ed=t&&can(t);
  const dd=r.dice.map((d,i)=>{let c='';
    if(ed&&t.s.cl==='analista'&&t.s.an>0&&r.tid===t.id)c+=`<a data-adj="${r.id}:${i}:-1">−</a><a data-adj="${r.id}:${i}:1">+</a>`;
    if(ed&&t.s.cl==='vigilante'&&t.s.pd[0]>=2&&d.v!==1)c+=`<a data-rr="${r.id}:${i}" title="Prontidão: rerrolar (2 PD)">↻</a>`;
    return `d${d.f}(${d.v})${c}`}).join(' + ');
  const res=r.crit==='s'?'SUCESSO CRÍTICO':r.crit==='f'?'FALHA CRÍTICA':r.ok?'sucesso':'falha';
  return `<div><b>${esc(r.n)}</b> · ${esc(r.p)}: ${dd}${r.pav?` · pavor d6(${r.pav})`:''} = ${r.total} <span class="${r.ok?'ok':'bad'}">${res}</span> <span class="mut">DT ${r.dt} · RA ${r.ra} RB ${r.rb}${r.dm!=null?` · </span><b class="ok">DANO ${r.dm}</b>`:'</span>'}</div>`}
function renderLog(){
  const h=logs.map(line).join('')||'<p class="mut">Nenhuma rolagem ainda.</p>';
  $('log').innerHTML=h;const o=$('ovlog');if(o)o.innerHTML=logs.slice(0,6).map(line).join('')||'<span class="mut">Nenhuma rolagem ainda.</span>'}
document.addEventListener('click',e=>{const a=e.target.closest('#log a');const t=cur();if(!a||!t)return;const d=a.dataset;
  if(d.adj){const[r,i,dir]=d.adj.split(':');tx({t:'adj',id:t.id,rid:+r,di:+i,dir:+dir})}else if(d.rr){const[r,i]=d.rr.split(':');tx({t:'reroll',id:t.id,rid:+r,di:+i})}});
/* ----- imagem do token ----- */
$('tkfile').onchange=()=>{const f=$('tkfile').files[0],id=imgTarget;$('tkfile').value='';if(!f||!id)return;
  const im=new Image();im.onload=()=>{const S=256,c=document.createElement('canvas');c.width=c.height=S;const k=Math.max(S/im.width,S/im.height);
    c.getContext('2d').drawImage(im,(S-im.width*k)/2,(S-im.height*k)*.2,im.width*k,im.height*k);
    let d=f.type==='image/png'?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.88);if(d.length>400000)d=c.toDataURL('image/jpeg',.7);
    tx({t:'img',id,data:d})};im.src=URL.createObjectURL(f)};
/* ----- combate por fases (livro) ----- */
const PH=['Fase geral','Ataques à distância','Ataques corpo a corpo'],CO={executor:0,analista:1,vigilante:2};
const CHIP={executor:['Executor','#b5483a'],analista:['Analista','#3f7cac'],vigilante:['Vigilante','#4f8a5b']};
function cmp(a,b){const na=a.pc===false?1:0,nb=b.pc===false?1:0;if(na!==nb)return na-nb;
  if(combat.mode==='perfil'&&!na){const d=(CO[a.s.cl]??3)-(CO[b.s.cl]??3);if(d)return d}return tokens.indexOf(a)-tokens.indexOf(b)}
function renderCombat(){
  const el=$('cbox');if(!el||!me)return;const a=document.activeElement;if(a&&el.contains(a)&&a.tagName==='SELECT')return;
  const c=combat,gm=me.gm,mem=tokens.filter(t=>t.cb!==false&&t.on!==false).sort(cmp);let h='';
  if(gm)h+=`<div class="row sm">${c.on?'<button class="g" data-c="stop">Encerrar</button><button class="g" data-c="prev">◀ Fase</button><button data-c="next">Próxima fase ▶</button>':'<button data-c="start">Iniciar combate</button>'}
    <select data-cmode><option value="perfil"${c.mode==='perfil'?' selected':''}>Ordem: Executor → Analista → Vigilante</option><option value="livro"${c.mode==='livro'?' selected':''}>Ordem: livro (sem ordem fixa)</option></select></div>`;
  if(!c.on){el.innerHTML=h+'<p class="mut">Nenhum combate em andamento.</p>';return}
  const row=t=>{const ch=t.pc===false?['NPC','#666']:CHIP[t.s.cl]||['?','#666'],ed=can(t);
    return `<div class="cr${t.id===sel?' on':''}${c.done[t.id]?' dn':''}" data-cid="${t.id}">${av(t,24)}<b>${esc(t.n)}</b><span class="cc" style="background:${ch[1]}">${ch[0]}</span>`+
    (ed?`<select data-cpick="${t.id}">${[['','aguardando'],['0','Geral'],['1','Distância'],['2','Corpo a corpo'],['-1','Sem ação']].map(([v,l])=>`<option value="${v}"${String(c.pick[t.id]??'')===v?' selected':''}>${l}</option>`).join('')}</select><button class="g" data-cdone="${t.id}">${c.done[t.id]?'↺':'✓ agiu'}</button>`:(c.done[t.id]?'<span class="ok">agiu</span>':''))+'</div>'};
  h+=`<div><b>Rodada ${c.round}</b> · ${PH[c.phase]}</div><p class="mut">${c.mode==='perfil'?'Dentro de cada fase: Executores → Analistas → Vigilantes (regra da casa); NPCs por último.':'Livro: não há iniciativa; ordem da mesa dentro da fase; NPCs por último.'} Ações da mesma fase são simultâneas.</p>`;
  for(const [g,name] of [[0,PH[0]],[1,PH[1]],[2,PH[2]],['w','Aguardando escolha'],[-1,'Sem ação (perde a rodada)']]){
    const rows=mem.filter(t=>g==='w'?c.pick[t.id]===undefined:c.pick[t.id]===g);
    if(!rows.length&&(g==='w'||g===-1))continue;
    h+=`<div class="cg${g===c.phase?' cur':''}"><h3>${g===c.phase?'▶ ':''}${name}</h3>${rows.map(row).join('')||'<span class="mut">—</span>'}</div>`}
  el.innerHTML=h}
$('cbox').addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(b&&b.dataset.c){tx({t:'combat',op:b.dataset.c});return}

   <button class="g" data-m="-1"${ed?'':' disabled'}>−1</button><button class="g" data-m="1"${ed?'':' disabled'}>+1</button><button data-m="sheet">Ficha</button>${me.gm&&t.pc===false?'<button class="g" data-m="del" title="Remover do mapa">🗑</button>':''}`}

  if(b.dataset.m==='sheet'){openSheet(t.id);return}

/* ----- abas (celular) ----- */
function setMob(){const m=innerWidth<=820;document.body.classList.toggle('m',m);if(m!==mob&&!$('ov').hidden)setTimeout(rerender,0);if(m&&!document.body.dataset.tab)document.body.dataset.tab='map';if(!m)delete document.body.dataset.tab;mob=m;resize()}

  [...$('tabs').children].forEach(x=>x.classList.toggle('on',x===b));if(b.dataset.tab==='map')setTimeout(resize,30);else window.scrollTo(0,0)});

/* ----- documentos ----- */
const fmtSize=n=>n>1048576?(n/1048576).toFixed(1)+' MB':n>1024?Math.round(n/1024)+' KB':'';
function renderDocs(){
  const el=$('docs');if(!el||!me)return;const gm=me.gm,a=document.activeElement;if(a&&el.contains(a)&&/INPUT|TEXTAREA/.test(a.tagName))return;
  el.innerHTML=(gm?`<div class="row sm"><button id="dup">+ Enviar arquivo</button><span class="mut">PDF ou imagem, até 2,5 MB</span></div><input type="file" id="dfile" accept="application/pdf,image/png,image/jpeg,image/webp,image/gif" hidden>
   <details class="lib"><summary>+ Nota de texto</summary><input id="dnt" placeholder="Título" maxlength="80" style="width:100%;margin:6px 0"><textarea id="dnx" placeholder="Texto da nota (os jogadores leem na tela)" style="width:100%;min-height:90px" maxlength="30000"></textarea><div class="row"><button id="dns">Salvar nota</button></div></details>`:'')+
  (docs.length?docs.map(d=>`<div class="li doc"><span class="ic">${d.note?'📝':d.mime==='application/pdf'?'📄':'🖼️'}</span><span><b>${esc(d.name)}</b> <small class="mut">${fmtSize(d.size)}${gm?(d.vis?' · visível':' · oculto'):''}</small></span>
    <button data-dopen="${d.id}">Abrir</button>${gm?`<button class="g" data-dvis="${d.id}:${d.vis?0:1}">${d.vis?'Ocultar':'Liberar'}</button><button class="g" data-dshow="${d.id}">Mostrar a todos</button><button class="g" data-ddel="${d.id}">✕</button>`:''}</div>`).join(''):
   '<p class="mut">Nenhum documento'+(gm?' ainda. Envie um arquivo ou crie uma nota.':' liberado pelo mestre ainda.')+'</p>')}
$('docs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(b.id==='dup')$('dfile').click();
  else if(b.id==='dns'){const n=$('dnt').value.trim(),x=$('dnx').value;if(!n&&!x.trim())return;tx({t:'docnote',name:n||'Nota',text:x});$('dnt').value='';$('dnx').value=''}
  else if(d.dopen)openDoc(d.dopen);
  else if(d.dvis){const[i,v]=d.dvis.split(':');tx({t:'docvis',id:i,v:+v})}
  else if(d.dshow)tx({t:'docshow',id:d.dshow});
  else if(d.ddel){if(confirm('Excluir este documento?'))tx({t:'docdel',id:d.ddel})}});
$('docs').addEventListener('change',e=>{if(e.target.id!=='dfile')return;const f=e.target.files[0];e.target.value='';if(!f)return;
  if(f.size>2.5*1024*1024){alert('Arquivo grande demais (máximo 2,5 MB).');return}
  const r=new FileReader();r.onload=()=>tx({t:'docup',name:f.name.replace(/\.[^.]+$/,''),data:r.result});r.readAsDataURL(f)});
function openDoc(id){pendingDoc=id;tx({t:'docget',id})}
let dUrl=null;
function showDoc(m){
  pendingDoc=null;$('dt').textContent=m.name;const db=$('db'),dl=$('dl');dl.hidden=true;if(dUrl){URL.revokeObjectURL(dUrl);dUrl=null}
  $('dv').hidden=false;
  if(m.text!==undefined){db.innerHTML='<div class="dtxt"></div>';db.firstChild.textContent=m.text;return}
  if(m.mime.startsWith('image/')){db.innerHTML=`<img src="${m.data}" alt="">`;return}
  db.innerHTML='<p class="mut">Carregando…</p>';
  fetch(m.data).then(r=>r.blob()).then(b=>{dUrl=URL.createObjectURL(b);dl.href=dUrl;dl.hidden=false;dl.download=m.name+'.pdf';
    db.innerHTML=`<iframe src="${dUrl}" title="${esc(m.name)}"></iframe>`}).catch(()=>{db.innerHTML='<p class="mut">Não foi possível exibir o arquivo.</p>'})}
$('dx').onclick=()=>{$('dv').hidden=true;$('db').innerHTML=''};
/* ----- biblioteca (mestre) + névoa ----- */
function renderLib(){
  const el=$('lib');if(!el)return;if(!me||!me.gm){el.hidden=true;return}el.hidden=false;
  const a=document.activeElement;if(a&&el.contains(a)&&/INPUT|SELECT/.test(a.tagName)&&a.type!=='checkbox')return;
  const pcs=tokens.filter(t=>t.pc!==false);
  const T=(k,l)=>`<button class="g${tool===k?' on':''}" data-tool="${k}">${l}</button>`;
  el.innerHTML=`<div class="lib"><b>Colocar no mapa</b>${placing?`<p class="mut">Clique no mapa para colocar <b>${esc(placing.name)}</b> (Esc cancela)</p>`:'<p class="mut">Escolha e clique no mapa onde quer colocar.</p>'}
   <div class="mut" style="margin-top:4px">Personagens</div>
   ${pcs.map(t=>`<div class="li">${av(t,30)}<span>${esc(t.n)}${t.o?` <small class="mut">(${esc(t.o)})</small>`:''}</span>${t.on===false?`<button data-placepc="${t.id}">Colocar</button>`:`<button class="g" data-unpl="${t.id}">Retirar</button>`}</div>`).join('')}
   <div class="mut" style="margin-top:6px">${lib.length?'Criaturas do livro':''}</div>
   ${lib.map(c=>`<div class="li"><img src="${c.img}"><span>${esc(c.name)} <small class="mut">PV ${c.hp} · ${c.z}×${c.z}</small></span><button data-placecr="${c.key}">Colocar</button></div>`).join('')}
   <div class="mut" style="margin-top:6px">Criaturas no mapa</div>
   ${tokens.filter(t=>t.pc===false).map(t=>`<div class="li">${av(t,26)}<span>${esc(t.n)}</span><button class="g" data-unpl="${t.id}">Remover</button></div>`).join('')||'<span class="mut">Nenhuma criatura no mapa.</span>'}
   ${tokens.some(t=>t.pc===false)?'<div class="row"><button class="g" data-clearcr="1">Remover todas as criaturas</button></div>':''}
   <label class="mut" style="display:block;margin-top:6px"><input type="checkbox" data-open${cfg.open?' checked':''}> Jogadores editam as fichas de todos os personagens</label></div>
  <div class="lib"><b>Iluminação e névoa de guerra</b>
   <div class="row sm"><button class="${fog.on?'':'g'}" data-fog="${fog.on?0:1}">${fog.on?'Névoa ligada':'Névoa desligada'}</button><button class="g" data-fogop="all">Revelar tudo</button><button class="g" data-fogop="clear">Reiniciar exploração</button></div>
   <div class="row tl">${T('move','Mover')}${T('seen1','Revelar')}${T('seen0','Esconder')}${T('wall1','Parede')}${T('wall0','Apagar parede')}<button class="g" data-fogop="clearwalls">Limpar paredes</button></div>
   <p class="mut">Cada token com luz ilumina ao redor; paredes bloqueiam a visão. Áreas já vistas ficam escurecidas. Você vê a névoa em modo transparente.</p></div>`}
$('lib').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.placepc){const t=tokens.find(k=>k.id===d.placepc);placing={kind:'pc',id:d.placepc,name:t?t.n:''};cv.style.cursor='crosshair';tool='move'}
  else if(d.placecr){const c=lib.find(k=>k.key===d.placecr);placing={kind:'cr',key:d.placecr,name:c?c.name:''};cv.style.cursor='crosshair';tool='move'}
  else if(d.unpl){tx({t:'unplace',id:d.unpl});return}
  else if(d.clearcr){if(confirm('Remover TODAS as criaturas e NPCs do mapa?'))tx({t:'clearcr'});return}
  else if(d.tool){tool=d.tool;placing=null;cv.style.cursor=tool==='move'?'':'crosshair'}
  else if(d.fog!==undefined){tx({t:'fogop',op:'on',v:+d.fog});return}
  else if(d.fogop){if(d.fogop==='clear'&&!confirm('Reiniciar a exploração? As áreas já vistas voltam a ficar escuras.'))return;tx({t:'fogop',op:d.fogop});return}
  renderLib()});
$('lib').addEventListener('change',e=>{if(e.target.dataset.open!==undefined)tx({t:'open',v:e.target.checked})});

  $('ttl').textContent=k==='universus'?'RPG Universus':'Mesa de RPG';$('lh1').textContent=$('ttl').textContent;document.title=k==='universus'?'RPG Universus':'Mesa de RPG – Ordem Paranormal 2';draw()}

setMob();connect();
